[package]
name = "queue-launcher-tauri-prototype"
version = "0.1.1"
edition = "2021"
default-run = "queue-launcher"

[[bin]]
name = "queue-launcher"
path = "src/app/main.rs"

[[bin]]
name = "queue-launcher-tauri-prototype"
path = "src/main.rs"
required-features = ["browser-harness"]

[features]
default = ["tauri/custom-protocol"]
browser-harness = []

[build-dependencies]
tauri-build = "2"

[dependencies]
arboard = { version = "3", default-features = false }
percent-encoding = "2"
regex = "1"
time = { version = "0.3", features = ["formatting"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["unstable"] }
tiny_http = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
dispatch2 = "0.3.1"
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSResponder", "NSView", "NSWindow", "objc2-core-foundation"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSError", "NSGeometry", "NSString", "NSURL", "NSURLError", "NSURLRequest", "NSUUID"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["WKFrameInfo", "WKNavigation", "WKNavigationAction", "WKNavigationDelegate", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore", "block2", "objc2-app-kit"] }
wry = "0.57.2"

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39.1"
windows-core = "0.62"
wry = "0.57.2"
