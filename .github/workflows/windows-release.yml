name: Windows release

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build; leave empty to test the selected branch'
        type: string
        default: ''
      publish:
        description: 'Upload to GitHub Releases (requires a tag)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-release-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'icurnvs/queue-launcher'
    runs-on: [self-hosted, Windows, X64, queue-launcher-release]
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.packages.outputs.tag }}
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name || github.ref }}
          persist-credentials: false
          fetch-depth: 0
      - name: Build and verify Windows packages
        id: packages
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name || (github.ref_type == 'tag' && github.ref_name) || '' }}
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: |
          Write-Output "PowerShell $($PSVersionTable.PSVersion); module path: $env:PSModulePath"
          # Keep Windows PowerShell's modules available when the parent process is PowerShell 7.
          $env:PSModulePath = "$PSHOME\Modules;$env:PSModulePath"
          Get-Command cargo, npx.cmd, Get-FileHash, Get-AuthenticodeSignature | Select-Object Name, Source
          ./Scripts/build-windows-release.ps1 -Tag $env:RELEASE_TAG -Publish:($env:PUBLISH -eq 'true')
      - name: Save packages and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.tag != '' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-release
          path: release
      - name: Upload to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            args=(--verify-tag --title "$RELEASE_TAG" --generate-notes)
            if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${args[@]}"
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
