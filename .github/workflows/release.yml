name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build; leave empty to test the selected branch'
        type: string
        default: ''
      publish:
        description: 'Upload both platforms to a draft release (requires a tag)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'icurnvs/queue-launcher'
    runs-on: [self-hosted, Windows, X64, queue-launcher-release]
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.packages.outputs.tag }}
      commit: ${{ steps.packages.outputs.commit }}
    defaults:
      run:
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Build and verify Windows packages
        id: packages
        env:
          RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: |
          Write-Output "PowerShell $($PSVersionTable.PSVersion); module path: $env:PSModulePath"
          # Keep Windows PowerShell's modules available when the parent process is PowerShell 7.
          $env:PSModulePath = "$PSHOME\Modules;$env:PSModulePath"
          Get-Command cargo, npx.cmd, Get-FileHash, Get-AuthenticodeSignature | Select-Object Name, Source
          ./Scripts/build-windows-release.ps1 -Tag $env:RELEASE_TAG -Publish:($env:PUBLISH -eq 'true')
      - name: Save packages and checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-release
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  macos:
    if: github.repository == 'icurnvs/queue-launcher'
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      commit: ${{ steps.packages.outputs.commit }}
    env:
      RUSTUP_TOOLCHAIN: '1.94.0'
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust toolchain
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Build and verify macOS package
        id: packages
        env:
          RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: bash Scripts/build-macos-release.sh
      - name: Save package and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-release
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: [build, macos]
    if: needs.build.outputs.tag != '' && (github.event_name != 'workflow_dispatch' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*-release'
          merge-multiple: true
          path: release
      - name: Upload both platforms to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          WINDOWS_COMMIT: ${{ needs.build.outputs.commit }}
          MACOS_COMMIT: ${{ needs.macos.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$WINDOWS_COMMIT" != "$MACOS_COMMIT" ]]; then
            echo 'The Windows and macOS packages must come from the same commit.' >&2
            exit 1
          fi
          if [[ $(find release -maxdepth 1 -type f | wc -l) -ne 8 ]]; then
            echo 'Expected four packages and four checksum files.' >&2
            exit 1
          fi
          (cd release && sha256sum --check *.sha256)
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            args=(--draft --verify-tag --title "$RELEASE_TAG" --generate-notes)
            if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${args[@]}"
          fi
          if [[ $(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft) != true ]]; then
            echo 'The release is already published; use a new version tag.' >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
