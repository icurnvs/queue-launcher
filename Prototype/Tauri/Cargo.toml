[package]
name = "queue-launcher-tauri-prototype"
version = "0.1.0"
edition = "2021"

[features]
default = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = "2"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["unstable"] }
tiny_http = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
wry = "0.57.2"
